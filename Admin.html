<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef9ff">
<title>Snow Man Fan Channel｜Station管理</title>
<style>
:root{--ink:#263640;--muted:#71818b;--line:#dbe9f0;--blue:#d8f2ff;--blue3:#5a9cba;--danger:#b94b56}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:linear-gradient(#eef9ff,#f8fbfd 45%,#fff);min-height:100vh}.wrap{max-width:680px;margin:auto;padding:22px 16px 70px}.hero{text-align:center;padding:14px 8px}.kicker{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--blue3)}h1{font-size:28px;margin:7px 0 8px}.lead{font-size:13px;line-height:1.7;color:var(--muted);margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 12px 30px rgba(53,99,120,.09)}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:6px}.field input{width:100%;border:1px solid #cbdce5;border-radius:14px;padding:13px 14px;font:inherit}.row{display:flex;gap:8px;align-items:center}.row input{flex:1}.btn{border:0;border-radius:14px;padding:12px 14px;font:inherit;font-weight:900}.primary{background:linear-gradient(#bce9fd,#d8f2ff);color:#245c74}.soft{background:#f1f7fa;color:#4c6673;border:1px solid var(--line)}.danger{background:#fff4f4;color:var(--danger);border:1px solid #efc8cc}.full{width:100%}.status{font-size:12px;line-height:1.6;color:var(--muted);margin-top:9px}.list{display:grid;gap:8px;margin-top:13px}.station{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;padding:10px 10px 10px 13px;border:1px solid var(--line);border-radius:14px;background:#fbfdfe}.station-id{font-weight:850;overflow-wrap:anywhere}.actions{display:flex;gap:5px}.mini{width:38px;height:38px;padding:0;border-radius:11px}.savebar{position:sticky;bottom:12px;margin-top:16px;padding:10px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(53,99,120,.12)}.hidden{display:none!important}.msg{margin-top:12px;padding:11px 12px;border-radius:13px;background:#f5fbff;border:1px solid #cfe4f2;font-size:12px;line-height:1.6;color:#466575}.error{background:#fff7f7;border-color:#edc8cc;color:#8a4650}.meta{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted);margin-bottom:10px}.count{font-weight:900;color:#4d788b}.remember{margin-top:10px;font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center}
</style>
</head>
<body>
<main class="wrap">
<section class="hero"><div class="kicker">FAN CHANNEL ADMIN</div><h1>対象Station管理</h1><p class="lead">申請ツールに追加するStationをスマホから管理できます。</p></section>
<section id="loginCard" class="card">
  <div class="field"><label for="adminKey">管理キー</label><input id="adminKey" type="password" autocomplete="current-password" placeholder="管理キーを入力"></div>
  <label class="remember"><input id="rememberKey" type="checkbox">この端末に管理キーを保存</label>
  <button id="loginBtn" class="btn primary full" style="margin-top:12px">管理画面を開く</button>
  <div id="loginMsg" class="msg hidden"></div>
</section>
<section id="adminCard" class="card hidden">
  <div class="meta"><span><span id="count" class="count">0局</span> 登録中</span><span id="updatedAt">—</span></div>
  <div class="field"><label for="newStation">Stationを追加</label><div class="row"><input id="newStation" autocapitalize="none" autocomplete="off" placeholder="@なしのStation ID"><button id="addBtn" class="btn primary">追加</button></div></div>
  <div id="list" class="list"></div>
  <div class="savebar"><button id="saveBtn" class="btn primary full">変更を保存</button><div id="saveMsg" class="status"></div></div>
</section>
</main>
<script>
let adminKey='',stations=[],revision=0,dirty=false;
const $=id=>document.getElementById(id);
function msg(el,text,error=false){el.textContent=text;el.classList.remove('hidden','error');if(error)el.classList.add('error');}
function clearMsg(el){el.textContent='';el.classList.add('hidden');el.classList.remove('error');}
function normalize(v){return String(v||'').trim().replace(/^@/,'').toLowerCase();}
function fmt(iso){if(!iso)return '更新日時 —';const d=new Date(iso);if(Number.isNaN(d.getTime()))return '更新日時 —';return '更新 '+d.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function render(){
  $('count').textContent=stations.length+'局';
  $('list').innerHTML='';
  stations.forEach((id,i)=>{
    const row=document.createElement('div');row.className='station';
    const name=document.createElement('div');name.className='station-id';name.textContent='@'+id;
    const actions=document.createElement('div');actions.className='actions';
    const up=document.createElement('button');up.className='btn soft mini';up.textContent='↑';up.disabled=i===0;up.onclick=()=>move(i,-1);
    const down=document.createElement('button');down.className='btn soft mini';down.textContent='↓';down.disabled=i===stations.length-1;down.onclick=()=>move(i,1);
    const del=document.createElement('button');del.className='btn danger';del.textContent='削除';del.onclick=()=>{if(confirm('@'+id+' を対象から外しますか？')){stations.splice(i,1);dirty=true;render();}};
    actions.append(up,down,del);row.append(name,actions);$('list').append(row);
  });
  $('saveBtn').textContent=dirty?'変更を保存':'保存済み';
}
function move(i,d){const j=i+d;if(j<0||j>=stations.length)return;[stations[i],stations[j]]=[stations[j],stations[i]];dirty=true;render();}
function addStation(){const id=normalize($('newStation').value);if(!id)return;if(!/^[a-z0-9_.-]{1,64}$/.test(id)){alert('Station IDに使用できない文字があります。');return;}if(stations.includes(id)){alert('すでに登録されています。');return;}stations.push(id);$('newStation').value='';dirty=true;render();}
function openAdmin(key){
  $('loginBtn').disabled=true;clearMsg($('loginMsg'));
  google.script.run.withSuccessHandler(state=>{
    adminKey=key;stations=state.stations||[];revision=Number(state.revision||0);dirty=false;
    $('updatedAt').textContent=fmt(state.updatedAt);$('loginCard').classList.add('hidden');$('adminCard').classList.remove('hidden');render();$('loginBtn').disabled=false;
    if($('rememberKey').checked)localStorage.setItem('smfcAdminKey',key);else localStorage.removeItem('smfcAdminKey');
  }).withFailureHandler(err=>{msg($('loginMsg'),err.message||String(err),true);$('loginBtn').disabled=false;}).getAdminState(key);
}
$('loginBtn').onclick=()=>openAdmin($('adminKey').value);
$('adminKey').addEventListener('keydown',e=>{if(e.key==='Enter')openAdmin($('adminKey').value);});
$('addBtn').onclick=addStation;$('newStation').addEventListener('keydown',e=>{if(e.key==='Enter')addStation();});
$('saveBtn').onclick=()=>{
  if(!dirty){$('saveMsg').textContent='変更はありません。';return;}
  $('saveBtn').disabled=true;$('saveMsg').textContent='保存しています…';
  google.script.run.withSuccessHandler(state=>{
    stations=state.stations||[];revision=Number(state.revision||0);dirty=false;$('updatedAt').textContent=fmt(state.updatedAt);$('saveMsg').textContent='保存しました。次回の申請から反映されます。';$('saveBtn').disabled=false;render();
  }).withFailureHandler(err=>{$('saveMsg').textContent=err.message||String(err);$('saveBtn').disabled=false;}).saveAdminStations(adminKey,stations,revision);
};
const saved=localStorage.getItem('smfcAdminKey')||'';if(saved){$('adminKey').value=saved;$('rememberKey').checked=true;}
</script>
</body>
</html>
